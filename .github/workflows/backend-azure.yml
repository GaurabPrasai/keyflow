name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-azure.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: keyflow-api
  PYTHON_VERSION: "3.12"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks and tests
        run: |
          python manage.py check
          python manage.py test keyflow --verbosity 1

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Package backend
        run: |
          zip -r "$GITHUB_WORKSPACE/backend.zip" . \
            -x "*.sqlite3" "*/__pycache__/*" "__pycache__/*" "*.pyc" "venv/*" ".venv/*"

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend.zip
